<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<title>Actividad del blog | Seravena</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<link rel="icon" type="image/png" href="../assets/isotype-chocolate.png">
<style>
:root{
  --chocolate:#4B412D;--chocolate-deep:#3a3222;--camel:#9D8051;--camel-light:#b89a6a;
  --arena:#EDE2D0;--arena-deep:#e0d4c0;--piedra:#F9F9F8;--pardo:#1A1A1A;--white:#fff;
  --muted:#6b6357;--verde:#4c7a53;--verde-bg:#e7f0e8;--radius:16px;--radius-sm:11px;
  --shadow:0 18px 50px rgba(75,65,45,.14);--shadow-sm:0 6px 20px rgba(75,65,45,.08);
}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Plus Jakarta Sans',sans-serif;background:var(--piedra);color:var(--pardo);min-height:100vh}
.bg{position:fixed;inset:0;z-index:0;background:radial-gradient(1100px 560px at 78% -14%,var(--arena),var(--piedra) 60%)}
.wrap{position:relative;z-index:1;max-width:1000px;margin:0 auto;padding:clamp(24px,5vw,52px) clamp(16px,4vw,32px)}

/* Encabezado */
.head{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;flex-wrap:wrap;margin-bottom:28px}
.head-l img{height:30px;display:block;margin-bottom:12px}
.head h1{font-size:clamp(1.5rem,4vw,2rem);color:var(--chocolate);font-weight:700;line-height:1.15}
.head p{color:var(--muted);font-size:.92rem;margin-top:5px}
.head-r{font-size:.8rem;color:var(--muted);text-align:right}
.head-r a{color:var(--camel);text-decoration:none;font-weight:600}
.head-r a:hover{text-decoration:underline}

/* Tarjetas de estadística */
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:14px;margin-bottom:30px}
.stat{background:var(--white);border:1px solid var(--arena-deep);border-radius:var(--radius);padding:20px 22px;box-shadow:var(--shadow-sm)}
.stat .n{font-size:2rem;font-weight:700;color:var(--chocolate);line-height:1}
.stat .l{font-size:.82rem;color:var(--muted);margin-top:6px}

/* Lista de artículos */
.list{display:flex;flex-direction:column;gap:12px}
.row{background:var(--white);border:1px solid var(--arena-deep);border-radius:var(--radius);padding:18px 22px;box-shadow:var(--shadow-sm);display:flex;align-items:center;gap:18px;flex-wrap:wrap}
.row-main{flex:1;min-width:240px}
.row-date{font-size:.76rem;color:var(--muted);letter-spacing:.02em}
.tag{display:inline-block;font-size:.68rem;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--camel);margin-left:8px}
.row-title{font-size:1.05rem;font-weight:600;color:var(--chocolate);margin:5px 0 3px;line-height:1.3}
.row-title a{color:inherit;text-decoration:none}
.row-title a:hover{text-decoration:underline}
.row-kw{font-size:.82rem;color:var(--muted)}
.row-kw b{color:var(--chocolate);font-weight:600}
.badges{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.badge{font-size:.76rem;font-weight:600;padding:5px 11px;border-radius:20px;white-space:nowrap}
.b-seo{background:var(--arena);color:var(--chocolate-deep)}
.b-seo.good{background:#eaf1e8;color:var(--verde)}
.b-med{background:var(--verde-bg);color:var(--verde)}
.b-estado{background:var(--chocolate);color:#fff}
.b-na{background:#f0ece4;color:var(--muted)}

.empty,.error{background:var(--white);border:1px dashed var(--arena-deep);border-radius:var(--radius);padding:40px;text-align:center;color:var(--muted)}
.foot{margin-top:34px;font-size:.78rem;color:var(--muted);text-align:center;line-height:1.6}
</style>
</head>
<body>
<div class="bg"></div>
<div class="wrap">

  <div class="head">
    <div class="head-l">
      <img src="../assets/wordmark-pardo.webp" alt="Seravena">
      <h1>Actividad del blog</h1>
      <p>Lo que el equipo de agentes va creando y publicando, de un vistazo.</p>
    </div>
    <div class="head-r">
      <div id="updated">—</div>
      <a href="https://www.clinicaseravena.com/blog/" target="_blank" rel="noopener">Ver el blog público →</a>
    </div>
  </div>

  <div class="stats" id="stats"></div>
  <div class="list" id="list"></div>

  <div class="foot">
    Panel privado · no indexado. Los datos se actualizan solos cada vez que el equipo publica.<br>
    También puedes ver el historial completo en GitHub (cada publicación queda registrada).
  </div>
</div>

<script>
const CAT_ES = {};
function fmtFecha(iso){
  try{
    const [y,m,d] = iso.split('-').map(Number);
    const meses = ['enero','febrero','marzo','abril','mayo','junio','julio','agosto','septiembre','octubre','noviembre','diciembre'];
    return d + ' de ' + meses[m-1] + ' de ' + y;
  }catch(e){ return iso; }
}
function esc(s){ const d=document.createElement('div'); d.textContent=s==null?'':s; return d.innerHTML; }

fetch('blog-actividad.json?v=' + Date.now())
  .then(r => { if(!r.ok) throw new Error('no data'); return r.json(); })
  .then(data => {
    const arts = (data.articulos || []).slice().sort((a,b)=> (b.fecha||'').localeCompare(a.fecha||''));
    document.getElementById('updated').textContent = 'Actualizado: ' + fmtFecha(data.actualizado || (arts[0]&&arts[0].fecha) || '');

    // Estadísticas
    const conSeo = arts.filter(a => typeof a.seo === 'number');
    const prom = conSeo.length ? Math.round(conSeo.reduce((s,a)=>s+a.seo,0)/conSeo.length) : '—';
    const ultimo = arts.length ? fmtFecha(arts[0].fecha) : '—';
    document.getElementById('stats').innerHTML = `
      <div class="stat"><div class="n">${arts.length}</div><div class="l">Artículos publicados</div></div>
      <div class="stat"><div class="n">${prom}${typeof prom==='number'?'<span style="font-size:1rem;color:var(--muted)">/100</span>':''}</div><div class="l">Nota SEO promedio</div></div>
      <div class="stat"><div class="n" style="font-size:1.15rem;padding-top:8px">${ultimo}</div><div class="l">Última publicación</div></div>
    `;

    // Lista
    if(!arts.length){ document.getElementById('list').innerHTML = '<div class="empty">Todavía no hay artículos publicados.</div>'; return; }
    document.getElementById('list').innerHTML = arts.map(a => {
      const seoBadge = (typeof a.seo === 'number')
        ? `<span class="badge b-seo ${a.seo>=90?'good':''}">SEO ${a.seo}/100</span>`
        : `<span class="badge b-na">SEO —</span>`;
      const medBadge = (a.medico === 'aprobado') ? `<span class="badge b-med">✓ Médico</span>` : '';
      const estadoBadge = `<span class="badge b-estado">${esc(a.estado || 'publicado')}</span>`;
      const link = a.url ? `<a href="${esc(a.url)}" target="_blank" rel="noopener">${esc(a.titulo)}</a>` : esc(a.titulo);
      return `
        <div class="row">
          <div class="row-main">
            <span class="row-date">${fmtFecha(a.fecha)}</span><span class="tag">${esc(a.categoria||'')}</span>
            <div class="row-title">${link}</div>
            <div class="row-kw">Palabra clave: <b>${esc(a.keyword||'—')}</b></div>
          </div>
          <div class="badges">${seoBadge}${medBadge}${estadoBadge}</div>
        </div>`;
    }).join('');
  })
  .catch(() => {
    document.getElementById('list').innerHTML = '<div class="error">No se pudo cargar la actividad.<br><small>Este panel funciona en la web publicada (clinicaseravena.com/admin/blog.html), no abriéndolo como archivo local.</small></div>';
  });
</script>
</body>
</html>
